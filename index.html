<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramientas de Inteligencia Merkadus</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1n9bD3nXaotF1G21LYdfSTpQqgCStXaxg">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            /* Eliminamos el centrado de la pantalla de login para que el dashboard ocupe todo de golpe */
        }

        /* Estilo del contenedor principal del sitio */
        #dashboard-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }

        header {
            background-color: #1b003a;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logos {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logos img {
            max-height: 35px;
            object-fit: contain;
        }

        /* Botones de pestañas superiores */
        .header-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* Estilo para la pestaña activa */
        .tab-btn.active {
            background-color: #0078d4;
            border-color: #0078d4;
            font-weight: 600;
        }

        /* Contenido de las secciones */
        .content-section {
            display: none;
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        .content-section.active {
            display: flex;
        }

        .content-section iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Contenedor Principal (Ocupa toda la pantalla directamente) -->
    <div id="dashboard-container">
        <header>
            <div class="header-left">
                <div class="header-logos">
                    <img src="https://lh3.googleusercontent.com/d/1n9bD3nXaotF1G21LYdfSTpQqgCStXaxg" alt="Logo BTL">
                </div>
                
                <!-- PESTAÑAS DE NAVEGACIÓN INTERNA -->
                <div class="header-tabs">
                    <button class="tab-btn active" onclick="cambiarPestana('gestion', this)">📊 Gestión de Mercaderismo</button>
                    <button class="tab-btn" onclick="cambiarPestana('inteligencia', this)">📊 Inteligencia de Mercaderismo</button>
                    <button class="tab-btn" onclick="cambiarPestana('impulsos', this)">📊 Impulsos</button>
                    <button class="tab-btn" onclick="cambiarPestana('tiendaperfecta', this)">📊 Tienda Perfecta</button>
                </div>
            </div>
        </header>

        <!-- SECCIÓN 1: POWER BI GESTION -->
        <div id="seccion-gestion" class="content-section active">
            <iframe title="ReportePowerBI" src="https://app.powerbi.com/view?r=eyJrIjoiZmE0NTEzN2EtMTRmYS00NjdhLTk1ODQtNGJmOTI2NGFmZjdlIiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>

        <!-- SECCIÓN 2: POWER BI INTELIGENCIA -->
        <div id="seccion-inteligencia" class="content-section">
            <iframe title="ReportePowerBI" src="https://app.powerbi.com/view?r=eyJrIjoiZjNhYjYzZDgtN2ZiMy00NDliLWFkYmUtNmVmYzMzYmU0Yzk1IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>

        <!-- SECCIÓN 3: POWER BI IMPULSOS -->
        <div id="seccion-impulsos" class="content-section">
            <iframe title="ReportePowerBI" src="https://app.powerbi.com/view?r=eyJrIjoiYWM3M2M1N2ItODIwZS00MGJjLTkyYTMtNmFhMmRlZWM0M2Y1IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>

        <!-- SECCIÓN 4: POWER BI TIENDA PERFECTA -->
        <div id="seccion-tiendaperfecta" class="content-section">
            <iframe title="ReportePowerBI" src="https://app.powerbi.com/view?r=eyJrIjoiZDYwNmZhOTctZWE0Ni00ODA0LTk3NTEtMTMwNGEwZThmZTY2IiwidCI6IjliNzVhNTU3LWQ2MTMtNDgyOC1iYjNjLWU3NGRhN2EwOTk1ZCIsImMiOjR9" allowFullScreen="true"></iframe>
        </div>
    </div>

    <script>
        function cambiarPestana(seccion, boton) {
            document.querySelectorAll('.content-section').forEach(sec => {
                sec.classList.remove('active');
            });

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            if (seccion === 'gestion') {
                document.getElementById('seccion-gestion').classList.add('active');
            } else if (seccion === 'inteligencia') {
                document.getElementById('seccion-inteligencia').classList.add('active');
            } else if (seccion === 'impulsos') {
                document.getElementById('seccion-impulsos').classList.add('active');
            } else if (seccion === 'tiendaperfecta') {
                document.getElementById('seccion-tiendaperfecta').classList.add('active');
            }

            boton.classList.add('active');
        }
    </script>

</body>
</html>

</body>
</html>
